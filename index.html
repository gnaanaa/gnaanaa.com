<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gnaanaa | Software Instruments</title>
    <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle">LIGHT MODE</button>
    <header style="padding: 150px 20px 80px; text-align: center;">
        <h1>GNAANAA</h1>
        <p style="letter-spacing: 5px; color: var(--text-dim); font-size: 0.8rem; margin-top: 10px;">SOFTWARE INSTRUMENTS</p>
    </header>
    <main class="container">
        <div class="app-grid">
            <a href="mtimer/index.html" class="app-card">
                <h2>MTIMER</h2>
                <p>High-precision meditation instrument with local biometric analysis.</p>
                <span style="color: var(--primary); font-size: 0.7rem; letter-spacing: 2px;">ENTER HUD &rarr;</span>
            </a>
            <div class="app-card" style="opacity: 0.2;"><h2>COMING SOON</h2><p>In calibration.</p></div>
        </div>
    </main>
    <footer><a href="mailto:support@gnaanaa.com">CONTACT</a></footer>
    <script>
        const toggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-theme');
            toggle.textContent = 'DARK MODE';
        }
        toggle.addEventListener('click', () => {
            body.classList.toggle('light-theme');
            const isLight = body.classList.contains('light-theme');
            toggle.textContent = isLight ? 'DARK MODE' : 'LIGHT MODE';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });
    </script>
</body>
</html>
