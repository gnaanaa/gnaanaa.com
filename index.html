<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gnaanaa | Software Instruments</title>
    <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle">LIGHT MODE</button>
    <header style="padding: 150px 20px 80px; text-align: center;">
        <h1>GNAANAA</h1>
        <p style="letter-spacing: 5px; color: var(--text-dim); font-size: 0.8rem; margin-top: 10px;">SOFTWARE INSTRUMENTS</p>
    </header>
    <main class="container">
        <div class="app-grid">
            <a href="mtimer/index.html" class="app-card">
                <h2>MTIMER</h2>
                <p>High-precision meditation instrument with local biometric analysis.</p>
                <span style="color: var(--primary); font-size: 0.7rem; letter-spacing: 2px;">ENTER HUD &rarr;</span>
            </a>
            <div class="app-card" style="opacity: 0.2;"><h2>COMING SOON</h2><p>In calibration.</p></div>
        </div>
    </main>
    <footer><a href="mailto:support@gnaanaa.com">CONTACT</a></footer>
	<script>
		const themeToggle = document.getElementById('themeToggle');
		const root = document.documentElement;

		// Safe Storage Helper to handle cases where localStorage is disabled (e.g. file:// protocol or blocked cookies)
		const themeStorage = {
			getItem(key) {
				try {
					return localStorage.getItem(key);
				} catch (e) {
					console.warn('localStorage is not accessible, using session storage fallback.', e);
					try {
						return sessionStorage.getItem(key);
					} catch (e2) {
						return this.fallbackStore[key] || null;
					}
				}
			},
			setItem(key, value) {
				try {
					localStorage.setItem(key, value);
				} catch (e) {
					console.warn('localStorage is not accessible, using session storage fallback.', e);
					try {
						sessionStorage.setItem(key, value);
					} catch (e2) {
						this.fallbackStore[key] = value;
					}
				}
			},
			fallbackStore: {}
		};

		function updateButtonText(isLight) {
			if (themeToggle) themeToggle.textContent = isLight ? 'DARK MODE' : 'LIGHT MODE';
		}

		// 1. Initial State Check (respects saved preference first, then falls back to system preferred scheme)
		const savedTheme = themeStorage.getItem('theme');
		const systemPrefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
		const isLight = savedTheme === 'light' || (!savedTheme && systemPrefersLight);

		if (isLight) {
			root.classList.add('light-theme');
			updateButtonText(true);
		} else {
			root.classList.remove('light-theme');
			updateButtonText(false);
		}

		// 2. Click Handler
		if (themeToggle) {
			themeToggle.addEventListener('click', () => {
				const isLightNow = root.classList.toggle('light-theme');
				themeStorage.setItem('theme', isLightNow ? 'light' : 'dark');
				updateButtonText(isLightNow);
			});
		}
	</script>
</body>
</html>
