<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gnaanaa | Software Instruments</title>
    <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle">LIGHT MODE</button>
    <header style="padding: 150px 20px 80px; text-align: center;">
        <h1>GNAANAA</h1>
        <p style="letter-spacing: 5px; color: var(--text-dim); font-size: 0.8rem; margin-top: 10px;">SOFTWARE INSTRUMENTS</p>
    </header>
    <main class="container">
        <div class="app-grid">
            <a href="mtimer/index.html" class="app-card">
                <h2>MTIMER</h2>
                <p>High-precision meditation instrument with local biometric analysis.</p>
                <span style="color: var(--primary); font-size: 0.7rem; letter-spacing: 2px;">ENTER HUD &rarr;</span>
            </a>
            <div class="app-card" style="opacity: 0.2;"><h2>COMING SOON</h2><p>In calibration.</p></div>
        </div>
    </main>
    <footer><a href="mailto:support@gnaanaa.com">CONTACT</a></footer>
	<script>
		const themeToggle = document.getElementById('themeToggle');
		const root = document.documentElement;

		function updateButtonText(isLight) {
			if (themeToggle) themeToggle.textContent = isLight ? 'DARK MODE' : 'LIGHT MODE';
		}

		// 1. Initial State Check (Immediate)
		const savedTheme = localStorage.getItem('theme');
		if (savedTheme === 'light') {
			root.classList.add('light-theme');
			updateButtonText(true);
		}

		// 2. Click Handler
		if (themeToggle) {
			themeToggle.addEventListener('click', () => {
				const isLightNow = root.classList.toggle('light-theme');
				localStorage.setItem('theme', isLightNow ? 'light' : 'dark');
				updateButtonText(isLightNow);
			});
		}
	</script>
</body>
</html>
